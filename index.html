<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1a1016">
<title>Что посмотрим</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Golos+Text:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: one-screen app in a velvet "screening room" — header, poster stack fills the middle, four verdict buttons at the bottom; a second view lists all marks */
:root{
  --bg:#1a1016; --surface:#24161e; --raise:#30202a; --line:#46323d;
  --fg:#f4ebe6; --muted:#b5a2a9; --brass:#dcae63;
  --like:#63c28f; --nope:#e66a62; --want:#dcae63; --skip:#9d96aa;
  --f-display:"Oswald","Arial Narrow",Impact,sans-serif;
  --f-body:"Golos Text",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.4;overflow:hidden;
  background-image:radial-gradient(120% 60% at 50% -10%, #3a1d2b 0%, transparent 60%)}
*{box-sizing:border-box}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--brass);outline-offset:2px}

.app{height:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:12px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px}

header{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.brand{font-family:var(--f-display);font-weight:700;font-size:22px;letter-spacing:.02em;text-transform:uppercase;line-height:1}
.brand span{color:var(--brass)}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button{border:0;background:transparent;padding:6px 14px;border-radius:999px;font-size:14px;font-weight:500;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}

.meta{display:flex;flex-direction:column;gap:6px}
.meta-row{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:13px;color:var(--muted)}
.count{font-family:var(--f-mono);font-variant-numeric:tabular-nums;color:var(--fg)}
.bar{height:3px;background:var(--line);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--brass);width:0;transition:width .3s}
.status{display:inline-flex;align-items:center;gap:6px}
.status::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--skip)}
.status[data-s="cloud"]::before{background:var(--like)}
.status[data-s="error"]::before{background:var(--nope)}

/* rating view */
.stage{flex:1;min-height:0;position:relative;container-type:size;display:grid;place-items:center}
.card{position:absolute;width:min(100%,380px,64cqh);aspect-ratio:2/3;max-height:100%;border-radius:18px;overflow:hidden;
  container-type:size;display:flex;flex-direction:column;background:var(--ink);
  touch-action:none;user-select:none;-webkit-user-select:none;will-change:transform;
  box-shadow:0 18px 40px rgba(0,0,0,.45),0 0 0 1px rgba(255,255,255,.08)}
.card.next{transform:scale(.94) translateY(14px);filter:brightness(.6)}
.card.top{cursor:grab}
.card.top:active{cursor:grabbing}
.art{position:relative;flex:1 1 auto;min-height:26%;overflow:hidden}
.art canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.art::after{content:"";position:absolute;inset:auto 0 0;height:45%;background:linear-gradient(transparent,var(--ink));pointer-events:none}
.art-meta{position:absolute;inset:0 0 auto;display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:16px 16px 0;z-index:1}
.year{font-family:var(--f-display);font-weight:700;font-size:clamp(28px,6.5cqh,42px);line-height:.9;color:#fff;text-shadow:0 2px 12px rgba(0,0,0,.45)}
.decade{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;color:rgba(255,255,255,.8);text-transform:uppercase;margin-top:6px;text-shadow:0 1px 6px rgba(0,0,0,.5)}
.origin{font-family:var(--f-mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;padding:4px 7px;border:1px solid rgba(255,255,255,.55);border-radius:4px;color:#fff;background:rgba(0,0,0,.25)}
.info{position:relative;z-index:1;flex:none;display:flex;flex-direction:column;gap:7px;padding:0 18px 16px;margin-top:-34px}
.p-title{font-family:var(--f-display);font-weight:700;text-transform:uppercase;line-height:1.02;font-size:clamp(20px,5cqh,30px);
  color:#fff;text-wrap:balance;letter-spacing:.005em;overflow-wrap:anywhere}
.p-orig{font-size:13px;color:rgba(255,255,255,.62);margin-top:-3px}
.p-desc{font-size:13.5px;line-height:1.42;color:rgba(255,255,255,.88);display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.p-dir{font-size:12.5px;color:rgba(255,255,255,.8)}
.p-dir b{font-weight:500;color:rgba(255,255,255,.55);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;margin-right:6px}
.p-foot{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chips span{font-size:11.5px;padding:2px 8px;border-radius:999px;background:rgba(255,255,255,.1);color:#fff}
.links{display:flex;gap:10px;font-size:12px}
.links a{color:var(--brass);text-decoration:none;border-bottom:1px solid rgba(220,174,99,.4)}
.links a:hover{border-bottom-color:var(--brass)}
.p-cast{font-size:12.5px;color:rgba(255,255,255,.88);margin-top:-3px}
.p-cast b{font-weight:500;color:rgba(255,255,255,.55);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;margin-right:6px}
.art-right{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.poster-link{font-size:12px;font-weight:500;color:#fff;text-decoration:none;padding:5px 11px;border-radius:999px;
  background:rgba(0,0,0,.45);border:1px solid rgba(255,255,255,.35);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.poster-link:hover{background:rgba(0,0,0,.65);border-color:#fff}
@container (max-height:520px){.p-desc{-webkit-line-clamp:3}}
@container (max-height:450px){.p-dir{display:none}}
@container (max-height:400px){.p-orig{display:none}}

.stamp{position:absolute;top:26px;padding:6px 12px;border:3px solid currentColor;border-radius:8px;font-family:var(--f-display);font-weight:700;
  font-size:24px;letter-spacing:.06em;text-transform:uppercase;opacity:0;pointer-events:none;background:rgba(0,0,0,.25)}
.stamp.like{left:18px;color:var(--like);transform:rotate(-12deg)}
.stamp.dislike{right:18px;color:var(--nope);transform:rotate(12deg)}
.stamp.want{left:50%;top:auto;bottom:40%;color:var(--want);transform:translateX(-50%) rotate(-4deg)}
.stamp.unseen{left:50%;top:38%;color:#fff;transform:translateX(-50%) rotate(4deg)}

.done{text-align:center;max-width:34ch;display:flex;flex-direction:column;gap:10px;align-items:center}
.done h2{font-family:var(--f-display);text-transform:uppercase;font-size:28px;margin:0;text-wrap:balance}
.done p{margin:0;color:var(--muted)}

.actions{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.act{display:flex;flex-direction:column;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:14px;
  padding:10px 4px 9px;font-size:12px;font-weight:500;line-height:1.15;text-align:center;transition:transform .1s,background .15s}
.act:active{transform:scale(.96)}
.act svg{width:22px;height:22px}
.act[data-v="dislike"] svg{color:var(--nope)}
.act[data-v="unseen"] svg{color:var(--skip)}
.act[data-v="want"] svg{color:var(--want)}
.act[data-v="like"] svg{color:var(--like)}
.act:disabled{opacity:.35;cursor:default}
.foot{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:12px;color:var(--muted)}
.undo{display:inline-flex;align-items:center;gap:6px;background:transparent;border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:13px}
.undo:disabled{opacity:.35;cursor:default}
.undo svg{width:14px;height:14px}

/* marks view */
.list-wrap{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px}
.filters{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.filters button{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;color:var(--muted)}
.filters button[aria-pressed="true"]{border-color:var(--brass);color:var(--fg)}
.filters .n{font-family:var(--f-mono);font-size:11px;margin-left:4px;opacity:.8}
.list{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;border-top:1px solid var(--line)}
.row{display:grid;grid-template-columns:6px 1fr auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.row .sw{width:6px;height:34px;border-radius:3px}
.row .t{min-width:0}
.row .t b{display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .t small{color:var(--muted);font-size:12px}
.row button{border:1px solid var(--line);background:transparent;border-radius:999px;padding:5px 10px;font-size:12px;color:var(--muted)}
.empty{color:var(--muted);padding:24px 0;text-align:center}


.tabs{display:flex;width:100%}
.tabs button{flex:1;padding:7px 4px;font-size:13px;white-space:nowrap}
.tabs .n{font-family:var(--f-mono);font-size:11px;margin-left:2px;opacity:.75}
.pickbar{display:flex;flex-direction:column;gap:8px;min-height:0}
.ftoggle{display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:9px 12px;font-size:13px}
.ftoggle span{color:var(--muted);flex:none}
.ftoggle b{font-weight:500;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ftoggle i{font-style:normal;color:var(--muted);font-size:10px}
.fpanel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:12px;max-height:56vh;overflow-y:auto}
.fgroup{display:flex;flex-direction:column;gap:6px}
.ftitle{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.fchips{display:flex;flex-wrap:wrap;gap:6px}
.fchips button,.factions button{border:1px solid var(--line);background:var(--raise);border-radius:999px;padding:6px 12px;font-size:13px;color:var(--fg)}
.fchips button[aria-pressed="true"]{background:var(--brass);border-color:var(--brass);color:#1a1016}
.factions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.factions .primary{background:var(--fg);color:var(--bg);border-color:var(--fg);font-weight:600}
.p-meta{font-family:var(--f-mono);font-size:11.5px;color:rgba(255,255,255,.7);margin-top:-3px}
.p-why{font-size:12.5px;color:rgba(255,255,255,.85);background:rgba(220,174,99,.14);border-left:2px solid var(--brass);padding:4px 8px;border-radius:0 6px 6px 0}
.p-why b{font-weight:600;color:#fff}
.pill{font-size:11px;font-weight:600;padding:4px 9px;border-radius:999px;background:var(--like);color:#0d1f15}
.card.pick .p-dir{display:none}
.card.pick .p-desc{-webkit-line-clamp:3}
.done.match .spark{font-family:var(--f-display);text-transform:uppercase;letter-spacing:.12em;color:var(--like);font-size:14px}
.done.match h2{font-size:30px}
.mhead{margin:0;color:var(--fg);font-size:14px;line-height:1.45}
.mhead b{font-family:var(--f-mono)}
.mwait{margin:0;color:var(--muted);font-size:13px}
.mwait:empty{display:none}
.mrow .why{display:block;color:var(--brass)}
.rlinks{display:flex;flex-direction:column;gap:4px;font-size:12px;align-items:flex-end}
.rlinks a{color:var(--brass);text-decoration:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}</style>
</head>
<body>

<div class="app">
  <header>
    <div class="brand">Что <span>посмотрим</span></div>
    <div class="seg" role="group" aria-label="Кто отмечает">
      <button id="who-nadia" data-who="nadia" aria-pressed="true">Надя</button>
      <button id="who-anton" data-who="anton" aria-pressed="false">Антон</button>
    </div>
  </header>

  <div class="meta">
    <div class="seg tabs" role="group" aria-label="Раздел">
      <button id="view-pick" data-view="pick" aria-pressed="true">Подбор</button>
      <button id="view-match" data-view="match" aria-pressed="false">Совпадения <span class="n" id="matchN">0</span></button>
      <button id="view-rate" data-view="rate" aria-pressed="false">Оценка</button>
      <button id="view-list" data-view="list" aria-pressed="false">Отметки</button>
    </div>
    <div class="meta-row"><span id="metaText"></span></div>
    <div class="bar"><i id="bar"></i></div>
  </div>

  <div id="pickBar" class="pickbar">
    <button id="ftoggle" class="ftoggle" aria-expanded="false" aria-controls="fpanel"></button>
    <div id="fpanel" class="fpanel" hidden></div>
  </div>

  <section id="rateView" style="display:contents">
    <div class="stage" id="stage"></div>
    <div class="actions">
      <button class="act" data-v="dislike" id="b-dislike"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg><span>Не понра&shy;вилось</span></button>
      <button class="act" data-v="unseen" id="b-unseen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M3 12s3.5-6 9-6 9 6 9 6-3.5 6-9 6-9-6-9-6z"/><path d="M4 20L20 4"/></svg><span id="unseenLbl">Не смотрела</span></button>
      <button class="act" data-v="want" id="b-want"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><path d="M6 3h12v18l-6-4-6 4z"/></svg><span>Хочу посмотреть</span></button>
      <button class="act" data-v="like" id="b-like"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 21s-7.5-4.6-9.5-9.3C1.2 8.5 3.3 5 6.8 5c2 0 3.4 1.1 4.2 2.4h2C13.8 6.1 15.2 5 17.2 5c3.5 0 5.6 3.5 4.3 6.7C19.5 16.4 12 21 12 21z"/></svg><span>Понра&shy;вилось</span></button>
    </div>
    <div class="foot">
      <span id="hint">Свайп: → понравилось, ← нет, ↑ хочу, ↓ не смотрела</span>
      <button class="undo" id="undo" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 010 12h-3"/></svg>Назад</button>
    </div>
  </section>

  <section id="listView" class="list-wrap" hidden>
    <div class="filters" id="filters"></div>
    <div class="list" id="list"></div>
  </section>

  <section id="matchView" class="list-wrap" hidden>
    <p class="mhead" id="matchHead"></p>
    <p class="mwait" id="matchWait"></p>
    <div class="list" id="matchList"></div>
  </section>

  <div class="foot"><span class="status" id="status" data-s="local">Подключаюсь…</span></div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>

/* ---------- generated covers: original genre art, drawn per film ---------- */
function hashStr(s){ let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
function mulberry(a){ return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function hexRgb(h){ const n = parseInt(h.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; }
function mix(a, b, t){ const A = hexRgb(a), B = hexRgb(b); return '#' + A.map((v, i) => Math.round(v + (B[i] - v) * t).toString(16).padStart(2, '0')).join(''); }
function rgba(h, a){ const [r, g, b] = hexRgb(h); return `rgba(${r},${g},${b},${a})`; }

function drawCover(cv, m){
  const W = Math.max(2, Math.round(cv.offsetWidth * Math.min(2, window.devicePixelRatio || 1)));
  const H = Math.max(2, Math.round(cv.offsetHeight * Math.min(2, window.devicePixelRatio || 1)));
  cv.width = W; cv.height = H;
  const x = cv.getContext('2d'); if (!x) return;
  const R = mulberry(hashStr(m.id));
  const u = Math.min(W, H) / 100;
  const g = m.genres[0], g2 = m.genres[1];
  const [c1, c2] = PALETTE[g] || PALETTE['Драма'];
  const lite = mix(c2, '#ffffff', .4), deep = mix(c1, '#000000', .45);
  const circle = (cx, cy, r, fill) => { x.beginPath(); x.arc(cx, cy, Math.max(0, r), 0, Math.PI * 2); x.fillStyle = fill; x.fill(); };
  const glow = (cx, cy, r, col, a) => { const gr = x.createRadialGradient(cx, cy, 0, cx, cy, r); gr.addColorStop(0, rgba(col, a)); gr.addColorStop(1, rgba(col, 0)); x.fillStyle = gr; x.fillRect(0, 0, W, H); };
  const stars = (n, a) => { for (let i = 0; i < n; i++) circle(R() * W, R() * H, u * (.15 + R() * .45), `rgba(255,255,255,${a * (.3 + R() * .7)})`); };
  const mountains = (layers, base, rough) => {
    for (let l = 0; l < layers; l++) {
      const y0 = H * (base + l * .1); x.beginPath(); x.moveTo(0, H);
      let y = y0 - R() * H * .08;
      for (let px = 0; px <= W + 10; px += W / 14) { y = Math.min(H, Math.max(H * .2, y + (R() - .5) * H * rough)); x.lineTo(px, y); }
      x.lineTo(W, H); x.closePath(); x.fillStyle = mix(c1, '#000000', .1 + l * .22); x.fill();
    }
  };

  // base gradient + tint of the second genre
  let gr = x.createLinearGradient(W * R(), 0, W * R(), H);
  gr.addColorStop(0, c2); gr.addColorStop(1, c1);
  x.fillStyle = gr; x.fillRect(0, 0, W, H);
  if (g2 && PALETTE[g2]) glow(W * (R() > .5 ? .9 : .1), H * .15, W * .9, PALETTE[g2][1], .45);

    case 'Фантастика': {
      stars(160, .9);
      const px = W * (.35 + R() * .35), py = H * (.3 + R() * .25), pr = u * (16 + R() * 14);
      const pg = x.createRadialGradient(px - pr * .4, py - pr * .4, pr * .1, px, py, pr);
      pg.addColorStop(0, lite); pg.addColorStop(1, deep); circle(px, py, pr, pg);
      x.save(); x.translate(px, py); x.rotate(-.35 + R() * .2); x.beginPath(); x.ellipse(0, 0, pr * 1.8, pr * .42, 0, 0, Math.PI * 2);

    }

      stars(70, .6);
      const mx = W * (.25 + R() * .5), my = H * (.22 + R() * .12);
      glow(mx, my, u * 40, lite, .5); circle(mx, my, u * 11, mix(lite, '#ffffff', .5));
      mountains(3, .5, .14);
      break;
    }
    case 'Приключения': {
      glow(W * (.2 + R() * .6), H * .35, u * 60, '#ffe2a8', .5);
      circle(W * (.2 + R() * .6), H * (.3 + R() * .1), u * 9, rgba('#fff3d6', .9));
      mountains(4, .42, .18);
      break;
    }
    case 'Вестерн': {
      const hy = H * .64, sx = W * (.35 + R() * .3), sr = u * 30;

    }
    case 'Ужасы': {
      x.fillStyle = 'rgba(0,0,0,.35)'; x.fillRect(0, 0, W, H);
      glow(W * (.3 + R() * .4), H * .25, u * 35, '#ffffff', .12);
      for (let i = 0; i < 40; i++) { x.fillStyle = `rgba(255,255,255,${.03 + R() * .06})`; x.fillRect(R() * W, 0, Math.max(1, u * .15), H); }

        x.fillStyle = mix(c2, '#ff2020', .35); x.fillRect(dx - w / 2, 0, w, len); circle(dx, len, w * .9, mix(c2, '#ff2020', .35));

    }
    case 'Триллер': {

      x.lineWidth = u * .45; x.strokeStyle = 'rgba(255,255,255,.13)';
      for (let r = u * 3; r < Math.hypot(W, H); r += u * 3.2) { x.beginPath(); x.arc(cx, cy, r, 0, Math.PI * 2); x.stroke(); }
      x.save(); x.translate(cx, cy); x.rotate(-.6 + R() * .4); x.fillStyle = rgba(mix(c2, '#ff4040', .5), .85); x.fillRect(-W, -u * .9, W * 2, u * 1.8); x.restore();

    }
    case 'Детектив': {

      const lg = x.createLinearGradient(0, 0, 0, H); lg.addColorStop(0, 'rgba(255,248,220,.38)'); lg.addColorStop(1, 'rgba(255,248,220,0)');
      x.beginPath(); x.moveTo(tx - u * 3, 0); x.lineTo(tx + u * 3, 0); x.lineTo(tx + W * .45, H); x.lineTo(tx - W * .45, H); x.closePath(); x.fillStyle = lg; x.fill();

      for (let i = -12; i < 12; i++) { x.fillStyle = 'rgba(255,236,200,.13)'; x.fillRect(ox, i * u * 7, W * 1.2, u * 3.6); }

      x.globalCompositeOperation = 'screen';
      circle(W / 2 - off, cy, r, rgba(lite, .75)); circle(W / 2 + off, cy, r, rgba(mix(c2, '#ffb3c6', .6), .75));
      x.globalCompositeOperation = 'source-over';
      for (let i = 0; i < 8; i++) glow(W * R(), H * R(), u * (6 + R() * 10), '#ffffff', .12);

      const cols = ['#ffd166', '#ef476f', '#06d6a0', '#4cc9f0', '#ffffff', '#f78c6b'];

        x.save(); x.translate(R() * W, R() * H * .85); x.rotate(R() * Math.PI); x.fillStyle = cols[Math.floor(R() * cols.length)];

      for (let px = W * R() * .1; px < W; px += u * (6 + R() * 4)) { const ph = u * (3 + R() * 3); x.fillRect(px, hy - ph, u * .8, ph); }

      for (let k = 0; k < 7; k++) {

      const lx = W * (.15 + R() * .7); x.beginPath(); x.moveTo(lx, 0); x.lineTo(lx, H); x.stroke();
    }

  for (let i = 0; i < 900; i++) { x.fillStyle = `rgba(255,255,255,${R() * .06})`; x.fillRect(R() * W, R() * H, u * .35, u * .35); }

}

      const v = r[w]; if (v !== 'like' && v !== 'dislike') continue;
      for (const g of m.genres) { A[g] = A[g] || { nadia: [0, 0], anton: [0, 0] }; A[g][w][v === 'like' ? 0 : 1]++; }
    }
  }
  const aff = (g, w) => { const x = A[g] && A[g][w]; if (!x) return .3; return (x[0] - 2 * x[1] + 1) / (x[0] + x[1] + 2); };
  const S = {};
  for (const m of CANDS) {
    let s = 0;
    for (const w of ['nadia', 'anton']) s += Math.min(...m.genres.map(g => aff(g, w))) * .4 + (m.genres.reduce((t, g) => t + aff(g, w), 0) / m.genres.length) * .6;
    const r = ratings[m.id] || {};
    if (r.nadia === 'want' || r.anton === 'want') s += .35;
    if (m.fresh) s += .05;
    S[m.id] = s;
  }
  scoreCache = S; scoreKey = key; return S;
}

/* ---------- filters ---------- */
const DECADES = [['old','до 80-х'],['80','80-е'],['90','90-е'],['00','00-е'],['10','10-е'],['20','20-е']];
const LENS = [['short','до 1 ч 45'],['mid','1 ч 45 – 2 ч 15'],['long','дольше 2 ч 15']];
const decKey = y => y < 1980 ? 'old' : y < 1990 ? '80' : y < 2000 ? '90' : y < 2010 ? '00' : y < 2020 ? '10' : '20';
const lenKey = n => n <= 105 ? 'short' : n <= 135 ? 'mid' : 'long';
const GENRES = [...new Set(CANDS.flatMap(m => m.genres))].sort((a, b) => CANDS.filter(m => m.genres.includes(b)).length - CANDS.filter(m => m.genres.includes(a)).length);
const passes = m =>
  (!F.g.length || m.genres.some(g => F.g.includes(g))) &&
  (!F.d.length || F.d.includes(decKey(m.year))) &&
  (!F.m.length || F.m.includes(m.mood)) &&
  (!F.len.length || F.len.includes(lenKey(m.runtime)));
function pickQueue(){
  const S = scores();
  const other_ = w => w === 'nadia' ? 'anton' : 'nadia';
  // films the other person already wants go first, then by taste score, mixing genres so the stack doesn't repeat
  const boost = m => { const v = picks[m.id] && picks[m.id][other_(who)]; return v === 'yes' ? 2 : v === 'maybe' ? 1 : 0; };
  const pool = CANDS.filter(m => passes(m) && !(picks[m.id] && picks[m.id][who])).sort((a, b) => boost(b) - boost(a) || S[b.id] - S[a.id]);
  const out = [];
  while (pool.length) {
    const recent = out.slice(-2).map(m => m.genres[0]);
    let i = pool.findIndex((m, k) => k < 8 && (boost(m) > 0 || !recent.includes(m.genres[0])));
    if (i < 0) i = 0;
    out.push(pool.splice(i, 1)[0]);
  }
  return out;
}
const isMatch = m => { const p = picks[m.id] || {}; const ok = v => v === 'yes' || v === 'maybe'; return ok(p.nadia) && ok(p.anton); };
const matches = () => { const S = scores(); return CANDS.filter(isMatch).sort((a, b) => {
  const pa = picks[a.id], pb = picks[b.id]; const sa = (pa.nadia === 'yes') + (pa.anton === 'yes'), sb = (pb.nadia === 'yes') + (pb.anton === 'yes');
  return sb - sa || S[b.id] - S[a.id]; }); };
function filterSummary(){
  const parts = [...F.g, ...F.d.map(k => DECADES.find(x => x[0] === k)[1]), ...F.m.map(k => MOODS[k]), ...F.len.map(k => LENS.find(x => x[0] === k)[1])];
  return parts.length ? parts.join(', ') : 'все фильмы';
}

/* ---------- storage ---------- */
function setStatus(s, text){ const el = $('status'); el.dataset.s = s; el.textContent = text; }
const chains = {};
function persist(coll, id){
  const store = coll === 'ratings' ? ratings : picks;
  lsSet(coll === 'ratings' ? LS_R : LS_P, store);
  if (!db) return;
  const k = coll + '/' + id;
  chains[k] = (chains[k] || Promise.resolve()).then(async () => {
    const b = store[id] || {};
    const body = {};
    if (b.nadia) body.nadia = b.nadia;
    if (b.anton) body.anton = b.anton;
    const ref = db.collection(coll).doc(id);
    if (!body.nadia && !body.anton) await ref.delete();
    else await ref.set({ ...body, title: (BY_ID[id] || CAND_BY_ID[id] || { ru: id }).ru, t: Date.now() });
    dirty[coll].delete(id);
  }).catch(e => {
    if (e && e.code === 'permission-denied') setStatus('error', 'База отклонила запись — отметка сохранена только на этом устройстве');
    else setStatus('error', 'Не сохранилось в облако, попробую при следующей отметке');
  });
}

function subscribe(coll, timer){
  db.collection(coll).onSnapshot({ includeMetadataChanges: true }, snap => {
    const cur = coll === 'ratings' ? ratings : picks;
    const next = {};
    for (const d of snap.docs) { const x = d.data() || {}; next[d.id] = { nadia: x.nadia, anton: x.anton }; }
    if (!cloudReady[coll] && !snap.metadata.fromCache) {
      cloudReady[coll] = true;
      for (const id of Object.keys(cur)) if (!next[id] && (cur[id].nadia || cur[id].anton)) dirty[coll].add(id);
    }
    for (const id of dirty[coll]) next[id] = cur[id];
    if (coll === 'ratings') ratings = next; else picks = next;
    lsSet(coll === 'ratings' ? LS_R : LS_P, next);
    if (cloudReady.ratings && cloudReady.picks) { clearTimeout(timer); setStatus('cloud', 'Общая база: Надя и Антон видят выбор друг друга'); }
    if (cloudReady[coll]) for (const id of [...dirty[coll]]) persist(coll, id);
    render();
  }, () => { clearTimeout(timer); setStatus('error', 'База недоступна, отметки сохраняются локально'); });
}
async function connect(){
  try { if (window.firebase) { firebase.initializeApp(FB_CONFIG); db = firebase.firestore(); } } catch { db = null; }
  if (!db) { setStatus('local', 'Нет связи с базой — отметки хранятся только на этом устройстве'); return; }
  setStatus('local', 'Загружаю отметки…');
  const timer = setTimeout(() => { if (!(cloudReady.ratings && cloudReady.picks)) setStatus('error', 'База пока не отвечает, отметки сохраняются локально'); }, 10000);
  subscribe('ratings', timer);
  subscribe('picks', timer);
}

/* ---------- actions ---------- */
function setVal(coll, id, w, v){
  const store = coll === 'ratings' ? ratings : picks;
  const cur = { ...(store[id] || {}) };
  if (v) cur[w] = v; else delete cur[w];
  store[id] = cur;
  dirty[coll].add(id);
  persist(coll, id);
}
let busy = false, flash = null, flashOn = false;
function rate(v){
  if (busy) return;
  flashOn = false;
  const isPick = view === 'pick';
  const top = (isPick ? pickQueue() : queue())[0];
  if (!top) return;
  busy = true;
  const coll = isPick ? 'picks' : 'ratings', store = isPick ? picks : ratings;
  history.push({ coll, id: top.id, w: who, prev: store[top.id] && store[top.id][who] });
  const card = document.querySelector('.card.top');
  const fly = { like:'translate(140%,10%) rotate(22deg)', dislike:'translate(-140%,10%) rotate(-22deg)',
                want:'translate(0,-130%) rotate(-4deg)', unseen:'translate(0,130%) rotate(4deg)' }[v];
  if (card) {
    card.querySelector('.stamp.' + v).style.opacity = 1;
    card.style.transition = 'transform .28s ease-in';
    card.style.transform = fly;
  }
  setTimeout(() => {
    const val = isPick ? PICK_OF[v] : v;
    setVal(coll, top.id, who, val);
    if (isPick && isMatch(top)) flash = top;
    busy = false; render();
  }, card ? 260 : 0);
}
function undo(){
  const h = history.pop(); if (!h) return;
  if (h.w !== who) { who = h.w; lsSet(LS_W, who); }
  if (h.coll === 'picks') view = 'pick'; else if (view !== 'list') view = 'rate';
  setVal(h.coll, h.id, h.w, h.prev);
  render(true);
}
function setWho(w){ who = w; lsSet(LS_W, w); render(true); }

/* ---------- rendering ---------- */
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const enc = encodeURIComponent;
const kpUrl = m => `https://www.kinopoisk.ru/index.php?kp_query=${enc(m.ru + ' ' + m.year)}`;
const imdbUrl = m => `https://www.imdb.com/find/?q=${enc(m.orig + ' ' + m.year)}`;
function decadeLabel(y){ return y < 1960 ? 'классика до 60-х' : (Math.floor(y / 10) * 10) + '-е'; }
function cardHTML(m, cls){
  const [c1] = PALETTE[m.genres[0]] || PALETTE['Драма'];
  const ink = mix(c1, '#0b0709', .55);
  const isPick = view === 'pick';
  const ST = isPick ? STAMP_PICK : STAMP_RATE;
  const anchors = isPick ? anchorTitles(m) : [];
  const other_ = isPick && picks[m.id] && picks[m.id][other(who)];
  const otherNote = other_ === 'yes' || other_ === 'maybe' ? `<span class="pill">${NAME[other(who)]} ${other_ === 'yes' ? 'хочет' : 'не против'}</span>` : '';
  return `<div class="card ${cls}${isPick ? ' pick' : ''}" data-id="${m.id}" style="--ink:${ink}">
    <div class="art">
      <canvas data-id="${m.id}" aria-hidden="true"></canvas>
      <div class="art-meta">
        <div><div class="year">${m.year}</div><div class="decade">${decadeLabel(m.year)}</div></div>
        <div class="art-right">
          <a class="poster-link" href="${kpUrl(m)}" target="_blank" rel="noopener">Постер ↗</a>
          ${m.ru_origin ? '<span class="origin">СССР / Россия</span>' : ''}
          ${otherNote}
        </div>
      </div>
    </div>
    <div class="info">
      <div class="p-title">${esc(m.title)}</div>
      ${isPick ? `<div class="p-meta">${fmtMin(m.runtime)} · ${MOODS[m.mood] || ''}</div>` : ''}
      ${m.desc ? `<div class="p-desc">${esc(m.desc)}</div>` : ''}
      ${anchors.length ? `<div class="p-why">Если понравилось: <b>${esc(anchors.join(', '))}</b></div>` : ''}
      ${m.cast ? `<div class="p-cast"><b>${m.genres.includes('Анимация') ? 'студия' : 'в ролях'}</b>${esc(m.cast)}</div>` : ''}
      <div class="p-dir"><b>реж.</b>${esc(m.dir)}</div>
      <div class="p-foot">
        <div class="chips">${m.genres.map(g => `<span>${g}</span>`).join('')}</div>
        <div class="links">
          <a href="${kpUrl(m)}" target="_blank" rel="noopener">Кинопоиск ↗</a>
          <a href="${imdbUrl(m)}" target="_blank" rel="noopener">IMDb ↗</a>
        </div>
      </div>
    </div>
    <div class="stamp like">${ST.like}</div><div class="stamp dislike">${ST.dislike}</div>
    <div class="stamp want">${ST.want}</div><div class="stamp unseen">${isPick ? ST.unseen : (who === 'nadia' ? 'Не видела' : 'Не видел')}</div>
  </div>`;
}

function renderFilters(){
  $('ftoggle').innerHTML = `<span>Фильтры</span><b>${esc(filterSummary())}</b><i>${filtersOpen ? '▲' : '▼'}</i>`;
  $('ftoggle').setAttribute('aria-expanded', filtersOpen);
  $('fpanel').hidden = !filtersOpen;
  if (!filtersOpen) return;
  const group = (key, title, items) => `<div class="fgroup"><div class="ftitle">${title}</div><div class="fchips">${
    items.map(([k, l]) => `<button data-fk="${key}" data-fv="${esc(k)}" aria-pressed="${F[key].includes(k)}">${esc(l)}</button>`).join('')}</div></div>`;
  const left = CANDS.filter(passes).length;
  $('fpanel').innerHTML =
    group('m', 'Настроение', Object.entries(MOODS)) +
    group('g', 'Жанр', GENRES.map(g => [g, g])) +
    group('d', 'Десятилетие', DECADES) +
    group('len', 'Длительность', LENS) +
    `<div class="factions"><button id="freset">Сбросить</button><button id="fdone" class="primary">Показать ${left}</button></div>`;
}

let shownKey = '';
function render(force){
  document.querySelectorAll('[data-who]').forEach(b => b.setAttribute('aria-pressed', b.dataset.who === who));
  document.querySelectorAll('[data-view]').forEach(b => b.setAttribute('aria-pressed', b.dataset.view === view));
  const swipe = view === 'pick' || view === 'rate';
  $('rateView').hidden = !swipe;
  $('rateView').style.display = swipe ? 'contents' : 'none';
  $('listView').hidden = view !== 'list';
  $('matchView').hidden = view !== 'match';
  $('pickBar').hidden = view !== 'pick';
  const ms = matches();
  $('matchN').textContent = ms.length;

  const q = view === 'pick' ? pickQueue() : queue();
  if (view === 'pick') {
    const pool = CANDS.filter(passes).length;
    $('metaText').innerHTML = `Осталось <span class="count">${q.length}</span> из ${pool} под фильтры`;
    $('bar').style.width = (pool ? (pool - q.length) / pool * 100 : 0) + '%';
    renderFilters();
  } else {
    const done = MOVIES.length - queue().length;
    $('metaText').innerHTML = `Отмечено <span class="count">${done} / ${MOVIES.length}</span>`;
    $('bar').style.width = (done / MOVIES.length * 100) + '%';
  }
  const L = view === 'pick'
    ? { dislike: 'Не хочу', unseen: 'Уже видели', want: 'Можно', like: 'Хочу' }
    : { dislike: 'Не понра&shy;вилось', unseen: label('unseen'), want: 'Хочу посмотреть', like: 'Понра&shy;вилось' };
  for (const k of VALS) $('b-' + k).querySelector('span').innerHTML = L[k];
  $('hint').textContent = view === 'pick'
    ? 'Свайп: → хочу, ← не хочу, ↑ можно, ↓ уже видели'
    : `Свайп: → понравилось, ← нет, ↑ хочу, ↓ ${who === 'nadia' ? 'не смотрела' : 'не смотрел'}`;
  $('undo').disabled = history.length === 0;
  document.querySelectorAll('.act').forEach(b => b.disabled = q.length === 0);

  if (swipe && flashOn && !force) return;
  if (swipe) {
    flashOn = false;
    const key = view + ':' + who + ':' + (q[0] ? q[0].id : '-') + ':' + (q[1] ? q[1].id : '-') + ':' + (flash ? flash.id : '');
    if (force || key !== shownKey) {
      shownKey = key;
      const stage = $('stage');
      if (flash) {
        const m = flash; flash = null;
        stage.innerHTML = `<div class="done match"><div class="spark">Совпадение</div><h2>${esc(m.title)}</h2>
          <p>Вы оба выбрали этот фильм. ${fmtMin(m.runtime)}.</p>
          <div class="factions"><button id="toMatches" class="primary">Все совпадения</button><button id="keepGoing">Свайпать дальше</button></div></div>`;
        shownKey = 'flash'; flashOn = true;
        return;
      }
      if (!q.length) {
        stage.innerHTML = view === 'pick'
          ? `<div class="done"><h2>${CANDS.filter(passes).length ? 'Под эти фильтры всё просмотрено' : 'Под эти фильтры ничего нет'}</h2>
             <p>${ms.length ? `Совпадений: ${ms.length}. Загляните во вкладку «Совпадения».` : 'Смените фильтры или дождитесь, пока второй тоже посвайпает.'}</p></div>`
          : `<div class="done"><h2>Всё отмечено</h2><p>Переходите в «Подбор»: там фильмы, которые вы ещё не видели.</p></div>`;
      } else {
        stage.innerHTML = (q[1] ? cardHTML(q[1], 'next') : '') + cardHTML(q[0], 'top');
        bindDrag(stage.querySelector('.card.top'));
        stage.querySelectorAll('canvas[data-id]').forEach(cv => { try { drawCover(cv, BY_ID[cv.dataset.id] || CAND_BY_ID[cv.dataset.id]); } catch {} });
      }
    }
  } else if (view === 'list') renderList();
  else renderMatches(ms);
}

function renderMatches(ms){
  const waiting = CANDS.filter(m => { const p = picks[m.id] || {}; const mine = p[who], theirs = p[other(who)];
    return (theirs === 'yes' || theirs === 'maybe') && !mine && passes(m); }).length;
  $('matchHead').innerHTML = ms.length
    ? `<b>${ms.length}</b> ${ms.length === 1 ? 'фильм хотите' : 'фильмов хотите'} оба. Сверху те, где оба нажали «Хочу».`
    : 'Пока совпадений нет. Свайпайте в «Подборе» оба: сюда попадут фильмы, которые выбрали и Надя, и Антон.';
  $('matchWait').textContent = waiting ? `${NAME[other(who)]} уже выбрал${who === 'nadia' ? '' : 'а'} ${waiting} фильм(ов), которые ты ещё не свайпал${who === 'nadia' ? 'а' : ''} — они первыми в «Подборе».` : '';
  $('matchList').innerHTML = ms.map(m => { const p = picks[m.id]; const both = p.nadia === 'yes' && p.anton === 'yes';
    return `<div class="row mrow">
      <span class="sw" style="background:${both ? 'var(--like)' : 'var(--want)'}"></span>
      <div class="t"><b>${esc(m.title)}</b><small>${m.year} · ${fmtMin(m.runtime)} · ${m.genres.join(', ')}</small>
        <small class="why">${both ? 'Оба: хочу' : 'Хочу + можно'}</small></div>
      <div class="rlinks"><a href="${kpUrl(m)}" target="_blank" rel="noopener">Кинопоиск</a><a href="${imdbUrl(m)}" target="_blank" rel="noopener">IMDb</a></div>
    </div>`; }).join('');
}

function renderList(){
  const counts = Object.fromEntries(VALS.map(v => [v, 0]));
  for (const m of MOVIES) { const v = ratings[m.id] && ratings[m.id][who]; if (v) counts[v]++; }
  $('filters').innerHTML = VALS.map(v =>
    `<button data-f="${v}" aria-pressed="${v === listFilter}">${label(v)}<span class="n">${counts[v]}</span></button>`).join('');
  const items = MOVIES.filter(m => ratings[m.id] && ratings[m.id][who] === listFilter)
    .sort((a, b) => a.title.localeCompare(b.title));
  $('list').innerHTML = items.length ? items.map(m => `<div class="row">
      <span class="sw" style="background:${COLOR[listFilter]}"></span>
      <div class="t"><b>${esc(m.title)}</b><small>${m.year} · ${m.genres.join(', ')}</small></div>
      <button data-reset="${m.id}">Вернуть в очередь</button></div>`).join('')
    : `<div class="empty">Здесь пока пусто</div>`;
}

/* ---------- swipe ---------- */
function bindDrag(card){
  if (!card) return;
  let sx = 0, sy = 0, dx = 0, dy = 0, active = false;
  const stamps = Object.fromEntries(VALS.map(v => [v, card.querySelector('.stamp.' + v)]));
  const dir = () => Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'like' : 'dislike') : (dy < 0 ? 'want' : 'unseen');
  card.addEventListener('pointerdown', e => {
    if (busy || e.target.closest('a')) return;
    active = true; sx = e.clientX; sy = e.clientY; dx = dy = 0;
    card.setPointerCapture(e.pointerId); card.style.transition = 'none';
  });
  card.addEventListener('pointermove', e => {
    if (!active) return;
    dx = e.clientX - sx; dy = e.clientY - sy;
    card.style.transform = `translate(${dx}px,${dy}px) rotate(${dx / 18}deg)`;
    const d = dir(), p = Math.min(1, Math.max(Math.abs(dx), Math.abs(dy)) / 110);
    for (const v of VALS) stamps[v].style.opacity = v === d ? p : 0;
  });
  const end = () => {
    if (!active) return; active = false;
    const far = Math.max(Math.abs(dx), Math.abs(dy)) > 100;
    if (far) { rate(dir()); return; }
    card.style.transition = 'transform .2s ease-out'; card.style.transform = '';
    for (const v of VALS) stamps[v].style.opacity = 0;
  };
  card.addEventListener('pointerup', end);
  card.addEventListener('pointercancel', end);
}

/* ---------- wiring ---------- */
document.querySelectorAll('.act').forEach(b => b.addEventListener('click', () => rate(b.dataset.v)));
document.querySelectorAll('[data-who]').forEach(b => b.addEventListener('click', () => setWho(b.dataset.who)));
document.querySelectorAll('[data-view]').forEach(b => b.addEventListener('click', () => { view = b.dataset.view; filtersOpen = false; render(true); }));
$('undo').addEventListener('click', undo);
$('ftoggle').addEventListener('click', () => { filtersOpen = !filtersOpen; renderFilters(); });
$('fpanel').addEventListener('click', e => {
  const b = e.target.closest('[data-fk]');
  if (b) { const k = b.dataset.fk, v = b.dataset.fv; F[k] = F[k].includes(v) ? F[k].filter(x => x !== v) : [...F[k], v]; lsSet(LS_F, F); render(true); return; }
  if (e.target.closest('#freset')) { F = JSON.parse(JSON.stringify(F0)); lsSet(LS_F, F); render(true); return; }
  if (e.target.closest('#fdone')) { filtersOpen = false; render(true); }
});
$('stage').addEventListener('click', e => {
  if (e.target.closest('#toMatches')) { view = 'match'; render(true); }
  else if (e.target.closest('#keepGoing')) { render(true); }
});
$('filters').addEventListener('click', e => { const b = e.target.closest('[data-f]'); if (b) { listFilter = b.dataset.f; renderList(); } });
$('list').addEventListener('click', e => {
  const b = e.target.closest('[data-reset]'); if (!b) return;
  const id = b.dataset.reset;
  history.push({ coll: 'ratings', id, w: who, prev: ratings[id] && ratings[id][who] });
  setVal('ratings', id, who, undefined); render(true);
});
document.addEventListener('keydown', e => {
  if ((view !== 'rate' && view !== 'pick') || e.metaKey || e.ctrlKey || filtersOpen) return;
  const map = { ArrowRight:'like', ArrowLeft:'dislike', ArrowUp:'want', ArrowDown:'unseen' };
  if (map[e.key]) { e.preventDefault(); rate(map[e.key]); }
  else if (e.key === 'Backspace' || e.key === 'z') { e.preventDefault(); undo(); }
});

let resizeT;
window.addEventListener('resize', () => { clearTimeout(resizeT); resizeT = setTimeout(() => { if (!busy) render(true); }, 180); });

render(true);
connect();
</script>
